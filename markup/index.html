<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Damper Markup</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; object-src 'none'; base-uri 'self'">
<style>body{font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:40px 20px;text-align:center;color:#1f2733;background:#eef0f3}a{color:#166ee1;font-weight:700}</style>
</head>
<body>
<p>Markup is now inside the Damper Inspection app.</p>
<p><a id="go" href="../beta/markup/">Open Markup</a></p>
<script>
// Markup moved to ../beta/markup/ (2026-11-18). Clear the old offline copy of this page, then forward.
// Saved marks and the last opened file stay: they live on this device for the whole site, not this folder.
(async () => {
  const to = '../beta/markup/' + location.hash;
  document.getElementById('go').href = to;
  try {
    if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) if (/\/markup\/$/.test(r.scope) && !/\/beta\/markup\/$/.test(r.scope)) await r.unregister();
    if (window.caches) for (const k of await caches.keys()) if (/^markup-v\d+$/.test(k)) await caches.delete(k);
  } catch (e) {}
  location.replace(to);
})();
</script>
</body>
</html>
