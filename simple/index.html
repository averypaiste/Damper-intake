<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Damper Inspection</title>
<style>body{font:16px system-ui,-apple-system,sans-serif;margin:0;padding:24px;color:#1b1f24;background:#f4f5f7}a{color:#1a7f4b;font-weight:600}.b{display:block;margin:12px 0;padding:12px;border-radius:10px;text-align:center;text-decoration:none;border:1px solid #1a7f4b}.p{background:#1a7f4b;color:#fff}</style>
</head><body>
<div id="go"><p>Opening the Damper Inspection app…</p><p><a href="../beta/">Tap here if it does not open</a></p></div>
<div id="left" hidden>
  <p><b id="n"></b> saved on this phone in the simple form and never exported. Export them first so they are not lost.</p>
  <a class="b p" href="app.html">Export my visits</a>
  <a class="b" href="../beta/">Skip and open the app</a>
</div>
<script>
// The simple form moved into the one app at /beta/. Visits saved here that were never exported get a chance to be exported first.
(async () => {
  try { if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) if (/\/simple\/$/.test(new URL(r.scope).pathname)) await r.unregister(); } catch {}
  let n = 0; try { n = (JSON.parse(localStorage.getItem('simple:entries') || '[]') || []).filter((e) => !e.exportedAt).length; } catch {}
  if (!n) return location.replace('../beta/');
  document.getElementById('n').textContent = n + (n === 1 ? ' visit is' : ' visits are');
  document.getElementById('go').hidden = true; document.getElementById('left').hidden = false;
})();
</script>
</body></html>
