<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Damper Inspection</title>
<style>body{font:16px system-ui,-apple-system,sans-serif;margin:0;padding:24px;color:#1b1f24;background:#f4f5f7}a{color:#1a7f4b;font-weight:600}</style>
</head><body>
<p id="msg">Opening the Damper Inspection app…</p>
<p><a href="beta/">Tap here if it does not open</a></p>
<script>
// The old version of the app lived here. It now forwards to the one app at /beta/.
// Before leaving, entries saved here that were never sent are moved into the app so they still sync.
(async () => {
  const go = () => location.replace('beta/');
  const open = (name) => new Promise((res, rej) => { const r = indexedDB.open(name, 1); r.onupgradeneeded = () => r.result.createObjectStore('q', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const all = (db) => new Promise((res, rej) => { const t = db.transaction('q', 'readonly').objectStore('q').getAll(); t.onsuccess = () => res(t.result || []); t.onerror = () => rej(t.error); });
  const done = (tx) => new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
  try {
    if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) { const s = new URL(r.scope).pathname; if (!/\/(beta|simple|floor)\/$/.test(s)) await r.unregister(); } // only the old app's own helper
    const cfg = JSON.parse(localStorage.getItem('cfg') || '{}');
    if (!localStorage.getItem('beta:cfg') && cfg.token) localStorage.setItem('beta:cfg', JSON.stringify(cfg)); // carry the Airtable token over
    const old = await open('intake'), items = (await all(old)).filter((it) => it.status !== 'synced');
    if (items.length) {
      document.getElementById('msg').textContent = 'Moving ' + items.length + ' unsent ' + (items.length === 1 ? 'entry' : 'entries') + ' into the app…';
      const base = cfg.base || 'appljnHf6IudjojK5', tbl = localStorage.getItem('tid') || cfg.table || 'AVERY APP TESTING';
      const nb = await open('beta'), tx = nb.transaction('q', 'readwrite'), st = tx.objectStore('q');
      for (const it of items) st.put({ ...it, base: it.base || base, tbl: it.tbl || tbl, status: it.status === 'error' ? 'pending' : it.status });
      await done(tx);
      const tx2 = old.transaction('q', 'readwrite'); for (const it of items) tx2.objectStore('q').delete(it.id); await done(tx2);
    }
    for (const k of await caches.keys()) if (/^intake-v\d+$/.test(k)) await caches.delete(k);
  } catch (e) { /* never block the way to the app */ }
  go();
})();
</script>
</body></html>
