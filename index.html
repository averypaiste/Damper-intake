<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.webmanifest">
<title>Damper Inspection</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1b1f24; --muted:#667085; --brand:#1f4e79; --ok:#1a7f4b; --warn:#b54708; --err:#b42318; --line:#d9dde3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151a; --card:#1b2028; --ink:#e8ecf1; --muted:#98a2b3; --brand:#5b9bd5; --line:#2e3642; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:env(safe-area-inset-bottom); }
  header { position:sticky; top:0; z-index:5; background:var(--brand); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  #net { font-size:13px; padding:3px 10px; border-radius:99px; background:rgba(255,255,255,.2); }
  #net.off { background:#b54708; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  label:first-child { margin-top:0; }
  input, select, textarea { width:100%; font:inherit; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  textarea { min-height:90px; }
  button { font:inherit; font-weight:600; padding:12px 16px; border:0; border-radius:10px; background:var(--brand); color:#fff; cursor:pointer; }
  button.secondary { background:transparent; color:var(--brand); border:1px solid var(--brand); }
  button.small { padding:6px 10px; font-size:14px; }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .two { display:flex; gap:10px; } .two > div { flex:1; }
  h2 { font-size:16px; margin:0 0 8px; }
  .hint { font-size:13px; color:var(--muted); margin:4px 0 0; }
  .sect { font-size:14px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:20px 0 4px; }
  .pblock { border:1px dashed var(--line); border-radius:10px; padding:10px; margin-top:10px; }
  .pblock .ph { display:flex; align-items:center; gap:8px; }
  .pblock .ph b { flex:1; }
  .pblock input[type=file] { display:none; }
  .pblock .addbtn { padding:6px 12px; font-size:14px; border-radius:8px; background:transparent; color:var(--brand); border:1px solid var(--brand); cursor:pointer; font-weight:600; }
  .thumbs { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .thumb { position:relative; width:72px; height:72px; border-radius:8px; overflow:hidden; border:1px solid var(--line); }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .thumb button { position:absolute; top:2px; right:2px; padding:0 6px; font-size:14px; line-height:20px; background:rgba(0,0,0,.65); border-radius:99px; }
  .item { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .item:first-of-type { border-top:0; }
  .item .t { flex:1; min-width:0; }
  .item .t b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .t span { font-size:13px; color:var(--muted); }
  .badge { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid currentColor; }
  .pending { color:var(--warn); } .synced { color:var(--ok); } .error { color:var(--err); }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#101828; color:#fff; padding:10px 16px; border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90%; z-index:20; }
  #toast.show { opacity:1; }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); max-width:480px; width:92%; }
  dialog::backdrop { background:rgba(0,0,0,.5); }
</style>
</head>
<body>
<header>
  <h1>Damper Inspection</h1>
  <span id="net">online</span>
  <button class="small secondary" id="btnSettings" style="color:#fff;border-color:#fff">Settings</button>
</header>

<main>
  <form id="form" class="card" autocomplete="off">
    <div id="fields"></div>
    <div class="sect">Photos (saved offline)</div>
    <p class="hint">Photos are shrunk on your device and kept until they upload.</p>
    <div id="photoBlocks"></div>
    <div class="row" style="margin-top:20px">
      <button type="submit">Save entry</button>
    </div>
  </form>

  <section class="card">
    <div class="row" style="align-items:center;margin-bottom:8px">
      <h2 style="flex:2">Saved entries <span id="count"></span></h2>
      <button class="small" id="btnSync">Sync now</button>
    </div>
    <div id="list"></div>
    <div class="row" style="margin-top:8px">
      <button class="small secondary" id="btnClear">Clear synced</button>
    </div>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="setForm">
    <h2>Airtable connection</h2>
    <label for="sTok">Personal access token</label>
    <input id="sTok" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <p class="hint">Stored only on this device. Give it write access to this one base only.</p>
    <div class="row" style="margin-top:8px">
      <button type="button" class="secondary small" id="sShow">Show token</button>
      <button type="button" class="secondary small" id="sTest">Test token</button>
      <button type="button" class="secondary small" id="sLists">Refresh lists</button>
    </div>
    <p class="hint" id="sResult"></p>
    <label for="sBase">Base ID (starts with app)</label>
    <input id="sBase" autocomplete="off">
    <label for="sTable">Table name or ID</label>
    <input id="sTable" autocomplete="off">
    <div class="row" style="margin-top:16px">
      <button type="button" class="secondary" id="sCancel">Cancel</button>
      <button type="submit" id="sSave">Save</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script>
/* ============ FORM SETUP ============
   key   = the EXACT Airtable field name (capitals and spaces must match)
   label = what the screen shows (optional)
   type  = text | textarea | select | number | date
   keep  = true: value stays filled in after saving (floor, inspector, date)
   half  = true: sits side by side with the next half field */
const FIELDS = [
  { key: 'Damper IDs',               type: 'select', existing: true, required: true },
  { key: 'Inspector(s)',             type: 'select', keep: true },
  { key: 'Inspection Date',          type: 'date', keep: true },
  { key: 'Operational Test',         type: 'select' },
  { key: 'Inspection Field Notes',   type: 'textarea' },
];

/* Attachment fields to fill while offline (exact Airtable names).
   Location Pic is not here on purpose. */
const PHOTOS = [
  'ID Tag - Ceiling Grid',
  'ID Tag - Damper',
  'Zoom Out Duct',
  'Open Damper',
  'Closed Damper',
  'Additional Pictures',
  'Actuator Device',
];
/* ====================================== */

const MAX_DIM = 1600, JPEG_Q = 0.8, TIMEOUT_MS = 45000;
const $ = (id) => document.getElementById(id);
const DEFAULTS = { base: 'appljnHf6IudjojK5', table: 'tbloI81HwwNzCdIwG' }; // test base; IDs are not secrets
const cfg = () => {
  const s = JSON.parse(localStorage.getItem('cfg') || '{}');
  return { token: s.token || '', base: s.base || DEFAULTS.base, table: s.table || DEFAULTS.table };
};
const keeps = () => JSON.parse(localStorage.getItem('keeps') || '{}');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

/* ---------- IndexedDB ---------- */
let dbp;
function db() {
  return dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open('intake', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('q', { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function tx(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction('q', mode), s = t.objectStore('q');
    const out = fn(s);
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
    t.onerror = () => rej(t.error);
  });
}
const putItem = (it) => tx('readwrite', (s) => s.put(it));
const delItem = (id) => tx('readwrite', (s) => s.delete(id));
const allItems = () => tx('readonly', (s) => s.getAll()).then((r) => (r || []).sort((a, b) => b.createdAt - a.createdAt));

/* ---------- Pick-lists (read from Airtable, cached for offline) ---------- */
const getOpts = () => { try { return JSON.parse(localStorage.getItem('opts') || '{}'); } catch { return {}; } };
async function refreshOptions(manual) {
  const c = cfg();
  if (!c.token) { if (manual) toast('Add your token in Settings first'); return; }
  if (!navigator.onLine) { if (manual) toast('Needs a connection'); return; }
  try {
    const r = await fetch(`https://api.airtable.com/v0/meta/bases/${c.base}/tables`, { headers: { Authorization: 'Bearer ' + c.token } });
    if (!r.ok) {
      if (manual) toast(r.status === 401 || r.status === 403 ? 'Token needs the schema.bases:read scope' : 'Could not load lists (' + r.status + ')');
      return;
    }
    const t = (await r.json()).tables.find((x) => x.id === c.table || x.name === c.table);
    if (!t) { if (manual) toast('Table not found in this base'); return; }
    const out = {}, missing = [];
    for (const f of FIELDS) {
      if (f.type !== 'select') continue;
      const fld = t.fields.find((x) => x.name === f.key);
      if (!fld) { missing.push(f.key); continue; }
      out[f.key] = { type: fld.type, choices: ((fld.options && fld.options.choices) || []).map((x) => x.name) };
      if (f.existing) {
        const recs = {};
        let offset = '';
        for (let page = 0; page < 50; page++) {
          const rr = await fetch(`https://api.airtable.com/v0/${c.base}/${encodeURIComponent(c.table)}?pageSize=100&fields%5B%5D=${encodeURIComponent(f.key)}${offset ? '&offset=' + offset : ''}`,
            { headers: { Authorization: 'Bearer ' + c.token } });
          if (!rr.ok) { if (manual) toast('Token needs the data.records:read scope to list dampers'); break; }
          const d = await rr.json();
          for (const rec of d.records) {
            let v = rec.fields[f.key];
            if (Array.isArray(v)) v = v[0];
            if (v == null || typeof v === 'object') continue;
            const label = String(v).trim();
            if (!label) continue;
            let k = label, n = 2;
            while (recs[k]) k = `${label} (${n++})`; // same ID twice: keep both, tell them apart
            recs[k] = rec.id;
          }
          if (!d.offset) break;
          offset = d.offset;
        }
        out[f.key].recs = recs;
        out[f.key].choices = Object.keys(recs).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
      }
      if (/Collaborator/.test(fld.type)) {
        // Airtable does not expose the collaborator list, so collect people already used in this column
        const people = {};
        for (const p of f.people || []) people[p.name] = { email: p.email };
        let offset = '';
        for (let page = 0; page < 10; page++) {
          const rr = await fetch(`https://api.airtable.com/v0/${c.base}/${encodeURIComponent(c.table)}?pageSize=100&fields%5B%5D=${encodeURIComponent(f.key)}${offset ? '&offset=' + offset : ''}`,
            { headers: { Authorization: 'Bearer ' + c.token } });
          if (!rr.ok) { if (manual && rr.status !== 404) toast('Token needs the data.records:read scope to list inspectors'); break; }
          const d = await rr.json();
          for (const rec of d.records) {
            const v = rec.fields[f.key];
            for (const u of Array.isArray(v) ? v : v ? [v] : []) if (u && (u.name || u.email)) people[u.name || u.email] = { id: u.id, email: u.email };
          }
          if (!d.offset) break;
          offset = d.offset;
        }
        out[f.key].people = people;
        out[f.key].choices = Object.keys(people).sort((a, b) => a.localeCompare(b));
      }
    }
    localStorage.setItem('opts', JSON.stringify(out));
    const snap = {};
    for (const f of FIELDS) snap[f.key] = $(fid(f.key)).value;
    buildFields();
    for (const f of FIELDS) if (snap[f.key] !== '') $(fid(f.key)).value = snap[f.key];
    if (manual) toast(missing.length ? 'No column named: ' + missing.join(', ') : 'Lists updated');
  } catch { if (manual) toast('Could not reach Airtable'); }
}

/* ---------- Form ---------- */
const fid = (k) => 'f_' + k.replace(/\W+/g, '_');
function makeField(f) {
  const wrap = document.createElement('div');
  const l = document.createElement('label');
  l.textContent = (f.label || f.key) + (f.required ? ' *' : '');
  l.htmlFor = fid(f.key);
  let el;
  if (f.type === 'textarea') el = document.createElement('textarea');
  else if (f.type === 'select') {
    const o = getOpts()[f.key], list = (o && o.choices) || [];
    if (list.length && f.existing) { // long list of existing rows: type-ahead box
      el = document.createElement('input'); el.type = 'text';
      el.setAttribute('list', 'dl_' + fid(f.key));
      el.autocomplete = 'off'; el.autocapitalize = 'off'; el.spellcheck = false;
      el.placeholder = 'Start typing, then pick from the list';
      const dl = document.createElement('datalist'); dl.id = 'dl_' + fid(f.key);
      list.forEach((n) => { const op = document.createElement('option'); op.value = n; dl.append(op); });
      wrap.append(dl);
    } else if (list.length) {
      el = document.createElement('select');
      el.append(new Option('', ''));
      list.forEach((n) => el.append(new Option(n, n)));
    } else { // no list loaded yet: plain box so the field still works
      el = document.createElement('input'); el.type = 'text';
      el.placeholder = o && /Collaborator/.test(o.type) ? 'Email address' : 'Type it (pick-list loads when online)';
    }
  } else {
    el = document.createElement('input');
    el.type = f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text';
    if (f.type === 'number') { el.inputMode = 'decimal'; el.step = 'any'; }
  }
  el.id = fid(f.key);
  if (f.required) el.required = true;
  wrap.append(l, el);
  return wrap;
}
function buildFields() {
  const box = $('fields'); box.textContent = '';
  for (let i = 0; i < FIELDS.length; i++) {
    const f = FIELDS[i], nxt = FIELDS[i + 1];
    if (f.half && nxt && nxt.half) {
      const r = document.createElement('div'); r.className = 'two';
      r.append(makeField(f), makeField(nxt)); box.append(r); i++;
    } else box.append(makeField(f));
  }
  applyKeeps();
}
function buildPhotos() {
  const pb = $('photoBlocks'); pb.textContent = '';
  for (const name of PHOTOS) {
    const blk = document.createElement('div'); blk.className = 'pblock';
    const head = document.createElement('div'); head.className = 'ph';
    const b = document.createElement('b'); b.textContent = name;
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true; inp.id = 'p_' + fid(name);
    const add = document.createElement('label'); add.className = 'addbtn'; add.htmlFor = inp.id; add.textContent = '+ Add';
    add.style.margin = '0';
    head.append(b, add, inp);
    const th = document.createElement('div'); th.className = 'thumbs'; th.id = 't_' + fid(name);
    blk.append(head, th); pb.append(blk);
    inp.addEventListener('change', async (e) => {
      for (const file of e.target.files) {
        try {
          const blob = await shrink(file);
          (pendingPhotos[name] ||= []).push({ blob, url: URL.createObjectURL(blob) });
        } catch { toast('Could not read a photo'); }
      }
      e.target.value = ''; renderThumbs(name);
    });
  }
}
function applyKeeps() {
  const k = keeps();
  for (const f of FIELDS) {
    if (!f.keep) continue;
    const el = $(fid(f.key));
    el.value = f.type === 'date' ? (k[f.key] || today()) : (k[f.key] || '');
  }
}

let pendingPhotos = {}; // { fieldName: [{blob, url}] }
function renderThumbs(name) {
  const t = $('t_' + fid(name)); t.textContent = '';
  (pendingPhotos[name] || []).forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'thumb';
    const im = document.createElement('img'); im.src = p.url;
    const b = document.createElement('button'); b.type = 'button'; b.textContent = '×';
    b.onclick = () => { URL.revokeObjectURL(p.url); pendingPhotos[name].splice(i, 1); renderThumbs(name); };
    d.append(im, b); t.append(d);
  });
}
async function shrink(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const k = Math.min(1, MAX_DIM / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close && bmp.close();
  return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('encode'))), 'image/jpeg', JPEG_Q));
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fields = {}, k = {};
  for (const f of FIELDS) {
    const v = $(fid(f.key)).value.trim();
    if (f.keep) k[f.key] = v;
    if (v === '') continue;
    let val = f.type === 'number' ? Number(v) : v;
    const o = f.type === 'select' && getOpts()[f.key];
    if (o && o.type === 'multipleSelects') val = [v];
    else if (o && /Collaborator/.test(o.type)) {
      const pp = (o.people && o.people[v]) || {};
      const who = pp.id ? { id: pp.id } : { email: pp.email || v };
      val = o.type === 'multipleCollaborators' ? [who] : who;
    }
    fields[f.key] = val;
  }
  let presetId = null;
  const ef = FIELDS.find((f) => f.existing);
  if (ef) {
    const o = getOpts()[ef.key];
    if (o && o.recs && Object.keys(o.recs).length) {
      presetId = o.recs[fields[ef.key]];
      if (!presetId) { toast('Pick a Damper ID from the list'); return; }
    }
  }
  localStorage.setItem('keeps', JSON.stringify(k));
  const photos = [];
  for (const name of PHOTOS) {
    (pendingPhotos[name] || []).forEach((p, i) =>
      photos.push({ field: name, name: `${name.replace(/\W+/g, '_')}_${i + 1}.jpg`, blob: p.blob, done: false }));
  }
  if (!photos.length && !Object.keys(fields).length) { toast('Add a photo or some notes first'); return; }
  const item = {
    id: crypto.randomUUID(), createdAt: Date.now(), fields, photos,
    recordId: presetId, preset: !!presetId, status: 'pending', error: '',
  };
  try { await putItem(item); }
  catch { toast('Could not save: phone storage may be full. Sync or free up space.'); return; }
  for (const name of PHOTOS) { (pendingPhotos[name] || []).forEach((p) => URL.revokeObjectURL(p.url)); }
  pendingPhotos = {}; PHOTOS.forEach(renderThumbs);
  $('form').reset(); applyKeeps();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  toast('Saved on this device');
  await render();
  sync();
});

/* ---------- Sync ---------- */
let syncing = false;
async function api(url, body, method) {
  const c = cfg();
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  try {
    const r = await fetch(url, {
      method: method || 'POST', signal: ctl.signal,
      headers: { Authorization: 'Bearer ' + c.token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      let m = r.status + ''; try { m += ' ' + (await r.json()).error.message; } catch {}
      const e = new Error(m); e.status = r.status; throw e;
    }
    return r.json();
  } finally { clearTimeout(timer); }
}
const b64 = (blob) => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload = () => res(String(fr.result).split(',')[1]);
  fr.onerror = () => rej(fr.error);
  fr.readAsDataURL(blob);
});

async function sync(manual) {
  const c = cfg();
  if (syncing) return;
  if (!c.token || !c.base || !c.table) { if (manual) { toast('Add your Airtable settings first'); openSettings(); } return; }
  if (!navigator.onLine) { if (manual) toast('No connection. Entries are safe on this device.'); return; }
  syncing = true; $('btnSync').disabled = true;
  try {
    const items = (await allItems()).filter((i) => i.status !== 'synced').reverse();
    for (const it of items) {
      try {
        // 1) create the record once; remember its id so a retry never duplicates it
        if (!it.recordId) {
          const res = await api(`https://api.airtable.com/v0/${c.base}/${encodeURIComponent(c.table)}`,
            { fields: it.fields, typecast: true });
          it.recordId = res.id; await putItem(it);
        } else if (it.preset && !it.patched) {
          // existing damper: fill in its row instead of creating a new one
          const body = { ...it.fields }; delete body[FIELDS[0].key];
          if (Object.keys(body).length) {
            await api(`https://api.airtable.com/v0/${c.base}/${encodeURIComponent(c.table)}/${it.recordId}`,
              { fields: body, typecast: true }, 'PATCH');
          }
          it.patched = true; await putItem(it);
        }
        // 2) upload each photo that is not done yet, into its own attachment field
        for (const p of it.photos) {
          if (p.done) continue;
          await api(`https://content.airtable.com/v0/${c.base}/${it.recordId}/${encodeURIComponent(p.field)}/uploadAttachment`,
            { contentType: 'image/jpeg', filename: p.name, file: await b64(p.blob) });
          p.done = true; await putItem(it);
        }
        it.status = 'synced'; it.error = '';
        it.photos.forEach((p) => (p.blob = null)); // free space
        await putItem(it);
      } catch (err) {
        it.status = 'error'; it.error = err.name === 'AbortError' ? 'Timed out, will retry' : err.message;
        await putItem(it);
        if (!navigator.onLine || err.name === 'AbortError' || err instanceof TypeError) break; // connection trouble: stop, retry later
        if (err.status === 401 || err.status === 403) { toast('Airtable refused the token. Check Settings.'); break; }
      }
      await render();
    }
  } finally {
    syncing = false; $('btnSync').disabled = false; await render();
    const left = (await allItems()).filter((i) => i.status !== 'synced').length;
    if (manual) toast(left ? left + ' still waiting' : 'All synced');
  }
}

/* ---------- List ---------- */
async function render() {
  const items = await allItems();
  const waiting = items.filter((i) => i.status !== 'synced').length;
  $('count').textContent = waiting ? `(${waiting} waiting)` : '';
  const list = $('list'); list.textContent = '';
  if (!items.length) { list.textContent = 'Nothing saved yet.'; return; }
  for (const it of items) {
    const row = document.createElement('div'); row.className = 'item';
    const t = document.createElement('div'); t.className = 't';
    const title = document.createElement('b');
    const note = (it.fields[FIELDS[0].key] || '').replace(/\s+/g, ' ');
    title.textContent = note ? (note.length > 40 ? note.slice(0, 40) + '…' : note) : '(no ID)';
    const sub = document.createElement('span');
    const done = it.photos.filter((p) => p.done).length;
    sub.textContent = new Date(it.createdAt).toLocaleString() + ` · ${done}/${it.photos.length} photos` + (it.error ? ' · ' + it.error : '');
    t.append(title, sub);
    if (it.recordId) {
      const c = cfg(), rid = document.createElement('span');
      rid.style.display = 'block';
      if (/^tbl/.test(c.table)) {
        const a = document.createElement('a');
        a.href = `https://airtable.com/${c.base}/${c.table}/${it.recordId}`;
        a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open in Airtable';
        a.style.color = 'var(--brand)'; rid.append(a);
      } else rid.textContent = 'Airtable record ' + it.recordId;
      t.append(rid);
    }
    const badge = document.createElement('span');
    badge.className = 'badge ' + it.status; badge.textContent = it.status === 'synced' ? 'synced' : it.status === 'error' ? 'retry' : 'waiting';
    row.append(t, badge);
    if (it.status !== 'synced') {
      const x = document.createElement('button'); x.className = 'small secondary'; x.textContent = 'Delete';
      x.onclick = async () => { if (confirm('Delete this entry from the device? If it is not synced it will be lost.')) { await delItem(it.id); render(); } };
      row.append(x);
    }
    list.append(row);
  }
}
$('btnSync').onclick = () => sync(true);
$('btnClear').onclick = async () => { for (const i of await allItems()) if (i.status === 'synced') await delItem(i.id); render(); };

/* ---------- Settings ---------- */
function openSettings() {
  const c = cfg();
  $('sTok').value = c.token || ''; $('sBase').value = c.base || ''; $('sTable').value = c.table || '';
  $('dlg').showModal();
}
$('btnSettings').onclick = openSettings;
$('sCancel').onclick = () => $('dlg').close();
$('sLists').onclick = () => {
  localStorage.setItem('cfg', JSON.stringify({ token: $('sTok').value.trim(), base: $('sBase').value.trim(), table: $('sTable').value.trim() }));
  refreshOptions(true);
};
$('sShow').onclick = () => {
  const t = $('sTok'); const show = t.type === 'password';
  t.type = show ? 'text' : 'password'; $('sShow').textContent = show ? 'Hide token' : 'Show token';
};
$('sTest').onclick = async () => {
  const tok = $('sTok').value.trim(), out = $('sResult');
  if (!tok) { out.textContent = 'Paste the token first.'; return; }
  const shape = `Length ${tok.length} (a normal Airtable token is 82), ${tok.startsWith('pat') ? 'starts with "pat"' : 'does NOT start with "pat"'}. `;
  out.textContent = 'Checking…';
  try {
    const r = await fetch('https://api.airtable.com/v0/meta/whoami', { headers: { Authorization: 'Bearer ' + tok } });
    if (r.ok) out.textContent = shape + 'Airtable accepts this token.';
    else if (r.status === 401) out.textContent = shape + 'Airtable says this token is not valid. Re-copy it from the developer hub, or create a new one.';
    else out.textContent = shape + 'Airtable replied with status ' + r.status + '.';
  } catch { out.textContent = shape + 'Could not reach Airtable. Check your connection.'; }
};
$('setForm').addEventListener('submit', () => {
  localStorage.setItem('cfg', JSON.stringify({
    token: $('sTok').value.trim(), base: $('sBase').value.trim(), table: $('sTable').value.trim(),
  }));
  toast('Settings saved'); sync(); refreshOptions();
});

/* ---------- Misc ---------- */
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800); }
function netState() { const n = $('net'); n.textContent = navigator.onLine ? 'online' : 'offline'; n.classList.toggle('off', !navigator.onLine); }
addEventListener('online', () => { netState(); sync(); refreshOptions(); });
addEventListener('offline', netState);

buildFields(); buildPhotos(); netState(); render(); sync(); refreshOptions();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
